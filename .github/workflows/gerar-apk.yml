name: Gerar APK

# Gera o app Android nativo (pasta app-android/): ele mostra o site
# https://controlo-financeiro-pro-3.vercel.app em tela cheia, sem barra de endereço e sem o
# aviso do Chrome. As versões novas do site chegam sozinhas no app; só é preciso gerar outro
# APK quando mudar algo na pasta app-android/ (por isso roda sozinho só nesse caso).
#
# O APK fica em Releases (link fixo: .../releases/latest/download/ControleFinanceiro.apk).
#
# Secrets necessários (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    conteúdo do arquivo .keystore em base64
#   ANDROID_KEYSTORE_PASSWORD  senha do keystore (a mesma vale para a chave)
# Use sempre a mesma chave: com outra chave o Android não instala o APK por cima do anterior.

on:
  push:
    branches: [main]
    paths:
      - 'app-android/**'
      - '.github/workflows/gerar-apk.yml'
  # Nos Pull Requests só compila (para conferir que não tem erro antes de aprovar); não publica
  pull_request:
    paths:
      - 'app-android/**'
      - '.github/workflows/gerar-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar a chave de assinatura
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Cadastre ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD em Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/controlefinanceiro.keystore"
          echo "CF_KEYSTORE=$RUNNER_TEMP/controlefinanceiro.keystore" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK assinado
        working-directory: app-android
        env:
          CF_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Sempre maior que o anterior (o APK antigo pelo Chrome chegou ao código 4)
          CF_VERSION_CODE: ${{ github.run_number }}0
          CF_VERSION_NAME: 2.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ControleFinanceiro.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ControleFinanceiro-apk
          path: ${{ runner.temp }}/ControleFinanceiro.apk

      - name: Publicar em Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-${{ github.run_number }}"
          gh release create "$TAG" "$RUNNER_TEMP/ControleFinanceiro.apk" \
            --target "${{ github.sha }}" \
            --title "Controle Financeiro (app ${{ github.run_number }})" \
            --notes "Instale pelo celular: baixe ControleFinanceiro.apk e abra o arquivo. Instala por cima da versão anterior, sem perder nada." \
            --latest
