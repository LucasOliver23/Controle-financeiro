name: Gerar APK

# Gera o APK do app Android (TWA, o mesmo tipo de APK do PWABuilder) a partir de android/twa-manifest.json.
# O APK só abre https://controlo-financeiro-pro-3.vercel.app, então as versões novas do site chegam
# sozinhas no app. Só é preciso gerar outro APK se mudar o nome, o ícone ou o endereço.
#
# Para rodar: aba Actions -> "Gerar APK" -> Run workflow.
# O APK fica em Releases (link fixo: .../releases/latest/download/ControleFinanceiro.apk).
#
# Secrets necessários (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64  conteúdo do arquivo .keystore em base64
#   ANDROID_KEYSTORE_PASSWORD  senha do keystore (a mesma vale para a chave)
# Use sempre a mesma chave: com outra chave o Android não instala o APK por cima do anterior.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Cadastre ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD em Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Preparar projeto
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.bubblewrap build-apk
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          echo "$KS" | base64 -d > build-apk/android.keystore
          VERSAO=$(python3 -c "import json; print(json.load(open('versao.json'))['versao'])")
          python3 - "$VERSAO" "${{ github.run_number }}" <<'EOF'
          import json, sys
          versao, run = sys.argv[1], int(sys.argv[2])
          m = json.load(open('android/twa-manifest.json'))
          m['appVersionCode'] = run
          m['appVersion'] = f'{versao}.{run}'
          json.dump(m, open('build-apk/twa-manifest.json', 'w'), indent=2)
          print('versionCode', run, '| versionName', m['appVersion'])
          EOF

      - name: Gerar e assinar APK
        working-directory: build-apk
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade < /dev/null
          bubblewrap build < /dev/null
          cp app-release-signed.apk ControleFinanceiro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ControleFinanceiro-apk
          path: build-apk/ControleFinanceiro.apk

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" build-apk/ControleFinanceiro.apk \
            --target "${{ github.sha }}" \
            --title "APK Controle Financeiro Pro (build ${{ github.run_number }})" \
            --notes "Instale pelo celular: baixe ControleFinanceiro.apk e abra o arquivo." \
            --latest
